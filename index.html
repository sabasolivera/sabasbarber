<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería San Juan | Enlaces</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandDark: '#0b0c0e',
                        brandCard: '#141619',
                        brandBorder: '#23272e',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0c0e;
            color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-white selection:text-black">

    <!-- Main Bio Content -->
    <main class="w-full max-w-md mx-auto px-4 py-12 flex-grow flex flex-col justify-center items-center">
        
        <!-- Header Section -->
        <div class="flex flex-col items-center text-center mb-8 w-full">
            <!-- Profile Avatar -->
            <div class="relative mb-5 group">
                <img id="displayAvatar" src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&q=80&w=300&h=300" alt="Sabas Barber" class="w-24 h-24 rounded-full object-cover border border-white/20 shadow-2xl">
            </div>

            <!-- Status Badge -->
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#141619] border border-[#23272e] text-[11px] font-medium tracking-wide uppercase mb-3 text-gray-400">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Turnos Disponibles</span>
            </div>

            <!-- Name Title -->
            <h1 class="text-2xl font-semibold tracking-tight text-white mb-1">Sabas Barber</h1>

            <!-- Subtitle -->
            <p class="text-xs sm:text-sm text-gray-400 max-w-xs font-light">Barbero · San Juan, Argentina 💈</p>
        </div>

        <!-- Links Stack -->
        <div class="w-full space-y-3">

            <!-- Primary Action: Turnero / Reservas -->
            <a href="https://wa.me/5492644835956?text=Hola!%20Quiero%20reservar%20un%20turno" target="_blank" rel="noopener" class="w-full p-3.5 rounded-xl bg-white text-black font-medium flex items-center justify-between shadow-lg hover:bg-gray-200 active:scale-[0.98] transition-all duration-200">
                <div class="flex items-center gap-3">
                    <i data-lucide="calendar" class="w-4 h-4 text-black"></i>
                    <span class="text-sm font-semibold tracking-tight">Reservar Turno Online</span>
                </div>
                <i data-lucide="arrow-right" class="w-4 h-4 opacity-80"></i>
            </a>

            <!-- WhatsApp Directo -->
            <a href="https://wa.me/5492644835956" target="_blank" rel="noopener" class="w-full p-3.5 rounded-xl bg-[#141619] border border-[#23272e] text-white font-medium flex items-center justify-between hover:border-white/30 active:scale-[0.98] transition-all duration-200 group">
                <div class="flex items-center gap-3">
                    <i data-lucide="message-square" class="w-4 h-4 text-gray-400 group-hover:text-emerald-400 transition-colors"></i>
                    <span class="text-sm">WhatsApp Directo</span>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400 group-hover:translate-x-0.5 transition-transform"></i>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/sabas.barber" target="_blank" rel="noopener" class="w-full p-3.5 rounded-xl bg-[#141619] border border-[#23272e] text-white font-medium flex items-center justify-between hover:border-white/30 active:scale-[0.98] transition-all duration-200 group">
                <div class="flex items-center gap-3">
                    <i data-lucide="instagram" class="w-4 h-4 text-gray-400 group-hover:text-pink-400 transition-colors"></i>
                    <span class="text-sm">Instagram / Cortes</span>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400 group-hover:translate-x-0.5 transition-transform"></i>
            </a>

            <!-- Ubicación Google Maps -->
            <a href="https://maps.google.com" target="_blank" rel="noopener" class="w-full p-3.5 rounded-xl bg-[#141619] border border-[#23272e] text-white font-medium flex items-center justify-between hover:border-white/30 active:scale-[0.98] transition-all duration-200 group">
                <div class="flex items-center gap-3">
                    <i data-lucide="map-pin" class="w-4 h-4 text-gray-400 group-hover:text-red-400 transition-colors"></i>
                    <span class="text-sm">Ubicación / Cómo llegar</span>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400 group-hover:translate-x-0.5 transition-transform"></i>
            </a>

        </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="w-full max-w-md mx-auto px-4 py-6 text-center text-xs text-gray-500">
        <p>© <span id="year">2026</span> Sabas Barber · San Juan, Argentina</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        lucide.createIcons();
    </script>
</body>
</html>
