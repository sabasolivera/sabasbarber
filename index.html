    <!-- JavaScript Logic -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Toggle Customizer Drawer
        function toggleCustomizer() {
            const panel = document.getElementById('customizerPanel');
            const backdrop = document.getElementById('customizerBackdrop');
            const isOpen = !panel.classList.contains('translate-x-full');

            if (isOpen) {
                panel.classList.add('translate-x-full');
                backdrop.classList.add('opacity-0');
                setTimeout(() => backdrop.classList.add('hidden'), 300);
            } else {
                backdrop.classList.remove('hidden');
                setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
                panel.classList.remove('translate-x-full');
            }
        }

        // Change Color Theme
        function setTheme(themeClass) {
            document.body.className = `${themeClass} min-h-screen flex flex-col justify-between antialiased selection:bg-white selection:text-black`;
            showToast("Tema actualizado");
        }

        // Live Preview Sync
        function updatePreview() {
            document.getElementById('displayName').textContent = document.getElementById('inputName').value || "San Juan Barber";
            document.getElementById('displaySubtitle').textContent = document.getElementById('inputSubtitle').value || "Barbero · San Juan, Arg";
            document.getElementById('displayStatus').textContent = document.getElementById('inputStatus').value || "Turnos Disponibles";
            
            const avatarUrl = document.getElementById('inputAvatar').value;
            if (avatarUrl) document.getElementById('displayAvatar').src = avatarUrl;

            document.getElementById('linkBooking').href = document.getElementById('inputLinkBooking').value;
            document.getElementById('linkWhatsapp').href = document.getElementById('inputLinkWhatsapp').value;
            document.getElementById('linkMaps').href = document.getElementById('inputLinkMaps').value;
            document.getElementById('linkInstagram').href = document.getElementById('inputLinkInstagram').value;
        }

        // Download HTML File
        function downloadHTML() {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Archivo index.html descargado");
        }

        // Copy Code to Clipboard
        function copyCode() {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const tempInput = document.createElement('textarea');
            tempInput.value = htmlContent;
            document.body.appendChild(tempInput);
            tempInput.select();
            
            try {
                document.execCommand('copy');
                showToast("Código copiado al portapapeles");
            } catch (err) {
                console.error("Error al copiar code", err);
            }
            document.body.removeChild(tempInput);
        }

        // Toast Helper
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }
    </script>
